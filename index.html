<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Popchat</title>
<style>
:root{--ink:#14171a;--bg:#fff;--card:#f4f5f7;--mut:#6b7480;--line:#e6e8ec;--blue:#12a8f2;--hd:#1a9bea;--org:#f58220;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--ink:#f2f4f7;--bg:#111418;--card:#1c2127;--mut:#98a2ae;--line:#2a3038}}
:root[data-theme=dark]{--ink:#f2f4f7;--bg:#111418;--card:#1c2127;--mut:#98a2ae;--line:#2a3038}
html,body{height:100%;margin:0}body{font:15px system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
*{box-sizing:border-box}button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
#app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden}
.splash{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:40px 24px;background:linear-gradient(160deg,#e6f6ff,#e9e4ff);color:#2a1a5e;text-align:center}
.splash img{width:210px;border-radius:44px;animation:pop .8s cubic-bezier(.2,1.4,.4,1)}.splash h1{font-size:30px;margin:0;background:linear-gradient(90deg,#6a2bd9,#e11bb4,#ff9a3c);-webkit-background-clip:text;background-clip:text;color:transparent}
.splash small{letter-spacing:.14em;color:#5b4a99}@keyframes pop{from{transform:scale(.4);opacity:0}}
.auth{flex:1;overflow:auto;padding:28px 22px;background:linear-gradient(180deg,var(--hd),var(--blue));color:#fff}
.auth .tabs{display:flex;background:#ffffff33;border-radius:12px;padding:4px;margin:18px 0}.auth .tabs button{flex:1;padding:10px;border-radius:9px;font-weight:600;color:#fff}.auth .tabs .on{background:#fff;color:#0a7fc4}
input,textarea{width:100%;font:inherit;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin:6px 0;outline:0}
.auth input{border:0;background:#fff;color:#14171a}.pri{width:100%;padding:14px;border-radius:12px;background:var(--org);color:#fff;font-weight:700;margin-top:10px}.err{color:#ffe1e1;background:#c0262633;padding:8px 10px;border-radius:8px;margin:6px 0}
.hd{background:var(--hd);color:#fff;display:flex;align-items:center;gap:10px;padding:14px 16px;font-weight:600;font-size:17px}.hd .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bell{position:relative}.bell i{position:absolute;top:-6px;right:-6px;background:#e53935;font:700 10px system-ui;border-radius:9px;padding:2px 5px;font-style:normal}
.chat{flex:1;overflow:auto;background:var(--blue);padding:14px 12px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:flex-end}.row.me{justify-content:flex-end}
.av{display:inline-flex;flex:none;border-radius:50%;align-items:center;justify-content:center;color:#fff;font-weight:700;background-size:cover;background-position:center;border:2px solid #ffffffaa;overflow:hidden}
.b{background:#f1f3f6;color:#14171a;border-radius:16px;padding:9px 13px;max-width:76%;word-wrap:break-word;line-height:1.3}.b .nn{font-size:14px;margin-bottom:2px}.b.o{background:var(--org);color:#fff}.b.off{outline:2px solid #e8b923}.b img{display:block;max-width:100%;border-radius:12px;margin-top:6px}
.bd{width:16px;height:16px;vertical-align:-3px;margin-left:2px}
.comp{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#7cd0fa}.comp input{margin:0;border-radius:22px;background:#f1f3f6;color:#14171a;border:0;flex:1}.comp button{width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:#fff}
.emo{background:#7cd0fa;padding:4px 12px;display:flex;gap:10px;font-size:22px;flex-wrap:wrap}
.nav{display:flex;align-items:center;justify-content:space-around;background:#fff;padding:8px 0 10px;border-top:1px solid #0001;color:#444;position:relative}.nav button{padding:8px 14px;color:#444}.nav .on{color:#12a8f2}
.ctr{width:58px;height:58px;border-radius:50%;margin-top:-30px;background:conic-gradient(#ff3b30,#ff9500,#ffcc00,#34c759,#12a8f2,#af52de,#ff3b30);display:flex;align-items:center;justify-content:center;border:4px solid #fff!important;padding:0!important}.ctr span{width:40px;height:40px;border-radius:50%;background:#fff;color:#f58220;font:800 26px system-ui;display:flex;align-items:center;justify-content:center}
.pg{flex:1;overflow:auto}.pad{padding:14px 16px}.card{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}.card .g{flex:1;min-width:0}.mut{color:var(--mut);font-size:13px}
.cover{height:140px;background:linear-gradient(120deg,#6a2bd9,#e11bb4,#ff9a3c) center/cover}.pf{margin:-44px 16px 0;display:flex;align-items:flex-end;justify-content:space-between}.pf .av{border:4px solid var(--bg)}
.sm{padding:8px 14px;border-radius:9px;background:var(--card);font-weight:600;font-size:13px}.sm.p{background:var(--org);color:#fff}.sm.d{background:#e5393522;color:#e53935}
.sec{padding:18px 16px 6px;color:var(--mut);font-size:12px;font-weight:600;text-transform:uppercase}.li{display:flex;align-items:center;gap:12px;padding:15px 16px;width:100%;text-align:left;border-bottom:1px solid var(--line)}.li span{flex:1}.li em{color:var(--mut);font-style:normal}
.sub{display:flex;align-items:center;gap:8px;padding:13px 16px;border-bottom:1px solid var(--line);font-weight:600}.sub .t{flex:1;text-align:center;margin-right:24px}
.tg{width:44px;height:26px;border-radius:13px;background:#c8ccd2;position:relative}.tg.on{background:#34c759}.tg:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}.tg.on:after{left:21px}
.doc{line-height:1.55}.doc h3{margin:18px 0 4px}
.note{background:#fff3cd;color:#664d03;font-size:12px;padding:6px 12px;text-align:center}
.b{position:relative}.row:not(.me) .b:before{content:"";position:absolute;left:-7px;bottom:0;border:8px solid transparent;border-right-color:#f1f3f6;border-bottom-color:#f1f3f6;border-left:0}
.row.me .b:after{content:"";position:absolute;right:-7px;bottom:0;border:8px solid transparent;border-left-color:#f58220;border-bottom-color:#f58220;border-right:0}
.ctr{background:none!important;border:0!important;width:66px;height:66px;margin-top:-38px}.ctr svg{display:block}
.dot{position:relative;display:inline-block;flex:none}.dot:after{content:"";position:absolute;right:1px;bottom:1px;width:11px;height:11px;border-radius:50%;background:#34c759;border:2px solid #fff}
.stp{display:flex;gap:12px;padding:10px 12px;overflow:auto;background:#0f95db}.stp>div{text-align:center;color:#fff;font-size:11px;flex:none;width:60px}.stp .av,.stv .av{pointer-events:none}
.ring{display:inline-flex;padding:3px;border-radius:50%;background:conic-gradient(#ff3b30,#ff9500,#ffcc00,#34c759,#12a8f2,#af52de,#ff3b30)}.ring.seen{background:#ffffff88}.ring .av{border:2px solid #0f95db}
.ov{position:fixed;inset:0;background:#000b;z-index:20;display:flex;align-items:flex-end;justify-content:center}.sheet{background:var(--bg);color:var(--ink);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:22px 20px 28px;max-height:90%;overflow:auto}
.stv{position:fixed;inset:0;z-index:30;background:#111;color:#fff;display:flex;flex-direction:column;max-width:480px;margin:0 auto}.stv .bar{height:3px;background:#fff4;margin:10px 3px}.stv .bar i{display:block;height:100%;background:#fff;width:0;animation:fill 5s linear forwards}@keyframes fill{to{width:100%}}
.stv .body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:26px;font-weight:700;gap:12px}.stv img{max-width:100%;max-height:70%;border-radius:12px}
</style></head><body><div id="app"></div>
